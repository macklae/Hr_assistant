[project]
name = "hr-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "John Austin Simon", email = "johnaustin999@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-cli[inmem]>=0.1.54",
    "langsmith>=0.14.4",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[project.scripts]
hr-assistant = "hr_assistant:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
